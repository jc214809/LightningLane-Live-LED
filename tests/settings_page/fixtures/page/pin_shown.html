<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0e1440"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="icon" href="/static/icon-512.png" type="image/png" sizes="512x512"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><title>Sign in · Board settings</title><style>@@STYLE@@</style></head><body><header class="topbar"><div class="topbar-in"><div class="brand"><span class="mark"><img src="/static/icon.svg" alt="" width="38" height="38"></span><div><div class="brand-name">LightningLane</div><div class="brand-sub">LED</div></div></div><div class="top-meta"></div></div></header><div class="center"><div class="card auth signin"><div class="auth-hero"><img src="/static/icon.svg" alt="" width="76" height="76"><div><div class="brand-name">LightningLane</div><div class="brand-sub">LED</div></div></div><h1>Sign in to this board</h1><p>To change this board's settings, type in the PIN it shows.</p><div class="notice good" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><div>The PIN is on the board for the next 2 minutes.</div></div><div class="step"><span class="step-n">1</span><div class="step-body"><strong>Show a PIN</strong><p>It appears on the LED board for two minutes.</p><div class="buttons"><form method="post" action="/pin/show"><button type="submit" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01"/></svg>Show a PIN on the board</button></form></div></div></div><div class="step"><span class="step-n">2</span><div class="step-body"><label for="pin"><strong>Type it in</strong></label><p>You stay signed in on this browser for an hour.</p><form method="post" action="/pin"><input type="text" id="pin" name="pin" class="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="8" required autofocus aria-label="PIN"><button type="submit" class="primary block">Sign in</button></form></div></div></div></div></body></html>
