name: Release

# A pushed vX.Y.Z tag becomes a GitHub release only if it matches version.py
# (tools/check_release_tag.py). The settings page's updater lists releases, not raw tags.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches version.py
        run: python tools/check_release_tag.py "${{ github.ref_name }}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
