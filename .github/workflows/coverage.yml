name: Tests and Code Coverage

on:
  push:
    branches:
      - main
      - develop
      # The updater's Beta channel installs develop-beta's tip only once its CI has passed.
      - develop-beta
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.11 is what the boards run (Raspberry Pi OS Bookworm); 3.13 is the next OS's (Trixie).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # In parallel, one worker per CPU (pytest-xdist). Coverage only on 3.11, the one uploaded:
      # measuring it slows the run.
      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pytest -n auto \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: pytest -n auto

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # 🔑 add this line
          files: coverage.xml                  # or ./coverage.xml if that’s how you had it
          fail_ci_if_error: true
          verbose: true
