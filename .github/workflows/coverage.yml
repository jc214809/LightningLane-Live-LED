name: Tests and Code Coverage

on:
  push:
    branches:
      - main
      - develop
      # The updater's Beta channel installs develop-beta's tip only once its CI has passed.
      - develop-beta
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.11 is what the boards run (Raspberry Pi OS Bookworm); 3.13 is the next OS's (Trixie).
    # Coverage is measured on 3.11 only, and slows each test, so that run is split in two
    # (TEST_SHARD, in the root conftest.py); Codecov merges the halves (codecov.yml's after_n_builds).
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            shard: "1/2"
          - python-version: "3.11"
            shard: "2/2"
          - python-version: "3.13"
    env:
      TEST_SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # In parallel, one worker per CPU (pytest-xdist).
      - name: Run tests with coverage
        if: matrix.shard
        run: |
          pytest -n auto \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Run tests
        if: ${{ !matrix.shard }}
        run: pytest -n auto

      - name: Upload coverage to Codecov
        if: matrix.shard
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # 🔑 add this line
          files: coverage.xml                  # or ./coverage.xml if that’s how you had it
          fail_ci_if_error: true
          verbose: true
