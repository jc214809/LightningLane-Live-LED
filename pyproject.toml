[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lightninglane-live-led"
version = "2.0.0"
description = "Disney World attraction wait times on an RGB LED matrix"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.13,<4",
    "certifi>=2024.0.0",
    "requests>=2.32.3,<3",
    "Pillow>=10.0.1,<12",
    "RGBMatrixEmulator>=0.13.3,<0.16",
    "pyowm>=3.5.0,<4",
]

[tool.setuptools.packages.find]
include = ["api*", "display*", "driver*", "parks*", "updater*", "utils*"]

# Code-health checks: see docs/dev/CODE-QUALITY.md.
[tool.ruff]
# The boards run 3.11 (docs/dev/CODE-QUALITY.md).
target-version = "py311"
# ruff format and E501 both wrap at 120 (docs/dev/CODE-QUALITY.md).
line-length = 120
# Ignored folders that can hold Python (virtualenvs, build output).
extend-exclude = [".venv*", "build", "dist"]

[tool.ruff.lint]
# E/F/W/B: pycodestyle, pyflakes, bugbear. C901, PLR0912/0913/0915: complexity, branches, arguments,
# statements. RUF100: fails on a `noqa` that no longer suppresses anything, so the baseline only shrinks.
# UP: pyupgrade (3.11 syntax). I: import sorting (isort).
select = ["E", "F", "W", "B", "C901", "PLR0912", "PLR0913", "PLR0915", "RUF100", "UP", "I"]
# B905 (zip strict=) would change behaviour. UP031 (printf `%` to f-strings) has no autofix and a hand
# rewrite can change output: `"%d" % 2.7` is "2", `f"{2.7:d}"` raises.
ignore = ["B905", "UP031"]

[tool.ruff.lint.pycodestyle]
# E501's limit. ruff format wraps code at 120; the 20 columns over that are for what it can't split: long
# strings, log messages and comments. Wrap a comment you touch at 120.
max-line-length = 140

[tool.ruff.lint.mccabe]
# Ruff's default, written down so it is visible.
max-complexity = 10

[tool.ruff.lint.pylint]
# Draw helpers legitimately take many arguments: 7, not the default 5.
max-args = 7

# Which package may import which: see docs/dev/CODE-QUALITY.md. Run with `lint-imports`.
[tool.importlinter]
root_packages = [
    "api",
    "parks",
    "updater",
    "display",
    "driver",
    "utils",
    "settings_page",
    "self_update",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api and parks stay below the display, the services and the driver"
type = "forbidden"
source_modules = ["api", "parks"]
forbidden_modules = ["updater", "display", "settings_page", "self_update", "driver"]

[[tool.importlinter.contracts]]
name = "display does not fetch: no api, aiohttp, requests or updater (but updater.shared)"
type = "forbidden"
source_modules = ["display"]
forbidden_modules = ["api", "aiohttp", "requests", "updater"]
allow_indirect_imports = true
ignore_imports = [
    "display.** -> updater.shared",
]

# The layers contract below also covers what three earlier forbidden contracts said (self_update not importing
# settings_page; driver and utils importing nothing above them), so those are gone.

[[tool.importlinter.contracts]]
name = "layers: each package imports only from those below it"
type = "layers"
layers = [
    "display | settings_page",
    "updater | self_update",
    "parks",
    "api | driver",
    "utils",
]
ignore_imports = [
    # The PIN file's path is owned by the settings service.
    "utils.settings_pin -> settings_page.pins",
]

# Type checking: see docs/dev/CODE-QUALITY.md.
[tool.mypy]
python_version = "3.11"
files = ["parks", "api"]
# Check the bodies of unannotated functions too; don't demand annotations everywhere yet.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Libraries without type information (pyowm) and the hardware/emulator layers stay untyped.
ignore_missing_imports = true
follow_imports = "silent"
# api/ has no __init__.py (a namespace package, imported from the repo root like the other layers).
namespace_packages = true
explicit_package_bases = true

# Coverage settings (CI's --cov=. overrides `source`).
[tool.coverage.run]
branch = true
relative_files = true
source = ["api", "display", "updater", "utils"]
omit = ["driver/*", "version.py"]
